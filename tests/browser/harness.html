<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEX — browser harness</title>
<!-- Generated from index.html. The three CDN <script> tags (Chart.js, EmailJS,
     supabase-js) and the Google Fonts <link> are deliberately REMOVED: this
     runs in a sandbox with no direct outbound network, so those requests hang
     until the socket times out and the load event never fires. stub.js
     provides Chart, emailjs and window.supabase locally instead. -->
<link rel="stylesheet" href="../../app.css">
</head>
<body>
<div id="app"><div class="loading-screen"><div class="spinner"></div><div style="color:var(--text2);font-size:13px">Connecting to JEX...</div></div></div>
<div id="legal-modal-root"></div>
<div id="bug-modal-root"></div>
<div id="contact-modal-root"></div>
<div class="toast" id="toast"></div>
<script>window.__JEX_PAGE__='market';</script>
<script src="stub.js"></script>
<script src="../../app.js"></script>
</body>
</html>
